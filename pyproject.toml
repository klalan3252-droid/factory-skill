[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-skill"
version = "0.1.0"
description = "Minimal autonomous software factory: FastAPI + LangGraph ticket processing"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain-core",
    "langchain-anthropic",
    "langgraph",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
