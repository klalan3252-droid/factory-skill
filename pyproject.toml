[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory"
version = "0.1.0"
description = "Autonomous software factory agent: labelled GitHub issues to reviewable pull requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
